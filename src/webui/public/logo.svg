<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">MAGI Memo</title>
  <desc id="desc">Three geometric MAGI cores linked around a central hexagonal opening</desc>
  <style>
    :root { color: #111827; }
    @media (prefers-color-scheme: dark) { :root { color: #ffffff; } }
  </style>
  <g fill="currentColor">
    <!-- Top core (Balthasar) -->
    <path d="M14 6h36v9L39 26H25L14 15z"/>
    <!-- Lower-left core (Casper) -->
    <path d="M3 35h13l11 10v13H3z"/>
    <!-- Lower-right core (Melchior) -->
    <path d="M48 35H61v23H37V45z"/>
  </g>
  <!-- Three links forming the central hexagon -->
  <path
    d="M39 26l9 9M37 45H27M16 35l9-9"
    fill="none"
    stroke="currentColor"
    stroke-width="2.5"
    stroke-linejoin="round"
    stroke-linecap="round"
  />
</svg>

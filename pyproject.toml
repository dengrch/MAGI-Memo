[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "magi-memo"
dynamic = ["version"]
authors = [
    {name = "MAGI Memo contributors"},
    {name = "HKUDS LightRAG contributors"},
]
description = "MAGI Core memory engine based on LightRAG, Neo4j, and Atom records"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "aiohttp",
    "configparser",
    "google-api-core>=2.0.0,<3.0.0",
    "google-genai>=1.0.0,<3.0.0",
    "json_repair>=0.59.9,<1.0.0",
    "nano-vectordb",
    "networkx",
    "numpy>=1.24.0,<3.0.0",
    "packaging",
    "pandas>=2.0.0,<2.4.0",
    "pipmaster",
    "pydantic",
    "pypinyin",
    "PyYAML>=6.0,<7.0",
    "python-dotenv",
    "setuptools",
    "tenacity",
    "tiktoken",
    "xlsxwriter>=3.1.0",
]

[project.optional-dependencies]
# Test framework dependencies (for CI/CD and testing)
pytest = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pre-commit",
    "ruff",
    "httpx2>=2.0.0",  # starlette>=1.3 testclient prefers httpx2 over httpx
]

api = [
    # Core dependencies
    "aiohttp",
    "configparser",
    "json_repair>=0.59.9,<1.0.0",
    "nano-vectordb",
    "networkx",
    "numpy>=1.24.0,<3.0.0",
    "openai>=2.0.0,<3.0.0",
    "pandas>=2.0.0,<2.4.0",
    "pipmaster",
    "pydantic",
    "pypinyin",
    "PyYAML>=6.0,<7.0",
    "python-dotenv",
    "setuptools",
    "tenacity",
    "tiktoken",
    "xlsxwriter>=3.1.0",
    "google-api-core>=2.0.0,<3.0.0",
    "google-genai>=1.0.0,<3.0.0",
    # API-specific dependencies
    "aiofiles",
    "ascii_colors",
    "distro",
    "fastapi>=0.108",  # 0.108 adds FastAPI.__call__ scope["root_path"] override; api_prefix relies on it
    "httpcore",
    # Respect HTTP(S)/ALL_PROXY, including socks5/socks5h desktop proxies.
    "httpx[socks]>=0.28.1",
    "jiter",
    "bcrypt>=4.0.0",
    "psutil",
    "PyJWT>=2.8.0,<3.0.0",
    "python-jose[cryptography]",
    "cryptography>=48.0.1",        # security floor: GHSA-537c-gmf6-5ccf (via python-jose[cryptography])
    "python-multipart>=0.0.30",    # security floor: CVE-2026-53539
    "starlette>=1.3.1,<2",         # security floor: CVE-2026-54283 / CVE-2026-48818 (transitive via fastapi)
    "pytz",
    "uvicorn",
    "uvicorn-worker",
    "gunicorn",
    # Document processing dependencies (required for API document upload functionality)
    "openpyxl>=3.0.0,<4.0.0",      # XLSX processing
    "pycryptodome>=3.0.0,<4.0.0",  # PDF encryption support
    "pypdf>=6.1.0",                 # PDF processing
    "python-docx>=0.8.11,<2.0.0",  # DOCX processing
    "python-pptx>=0.6.21,<2.0.0",  # PPTX processing
    "cairosvg>=2.5.0,<3.0.0",      # SVG->PNG rasterization for native markdown images
    "defusedxml>=0.7.0,<1.0.0",    # Safer XML parser used by parser/docx
    # Chunking strategies (process_options=R / V); lazy-imported by lightrag.chunker
    "langchain-text-splitters>=0.3,<2",
    "langchain-experimental>=0.3.2,<1",  # >=0.3.2: SemanticChunker gained min_chunk_size
    # NLP runtime for the native docx smart_heading engine parameter
    # (sentence/NER heuristics). Language models are separate wheels pinned in
    # requirements-offline-smart-heading.txt and installed via
    # `lightrag-download-cache --spacy --spacy-install`.
    # Cap below 3.8.14: that release (the latest 3.8.x) shipped neither a cp314
    # wheel nor an sdist, breaking `uv sync --frozen` on Python 3.14. 3.8.13 is
    # the last release with full wheel + sdist coverage. Revisit when adopting
    # spacy 4.x (still in dev as of this pin).
    "spacy>=3.8,<3.8.14",
]

# Offline deployment dependencies (layered design for flexibility)
offline-storage = [
    # Storage backend dependencies
    "faiss-cpu>=1.7.0,<2.0.0",
    "redis>=5.0.1,<9.0.0",
    "neo4j>=5.0.0,<7.0.0",
    "pymilvus>=2.6.2,<4.0.0",
    "pymongo>=4.0.0,<5.0.0",
    "asyncpg>=0.31.0,<1.0.0",
    "pgvector>=0.4.2,<1.0.0",
    "qdrant-client>=1.11.0,<2.0.0",
    "opensearch-py>=3.0.0,<4.0.0",
]

offline-llm = [
    # LLM provider dependencies
    "openai>=2.0.0,<3.0.0",
    "anthropic>=0.18.0,<1.0.0",
    "ollama>=0.1.0,<1.0.0",
    "zhipuai>=2.0.0,<3.0.0",
    "aioboto3>=12.0.0,<16.0.0",
    "voyageai>=0.2.0,<1.0.0",
    "llama-index>=0.14.0,<1.0.0",  # Updated to ensure compatibility with openai 2.x
    "llama-index-llms-openai>=0.6.12",  # Explicitly require version that supports openai 2.x
    "google-api-core>=2.0.0,<3.0.0",
    "google-genai>=1.0.0,<3.0.0",
]

offline = [
    # Complete offline package (includes api for document processing, plus storage and LLM)
    "magi-memo[api,offline-storage,offline-llm]",
]

test = [
    "magi-memo[api]",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pre-commit",
    "ruff",
    "httpx2>=2.0.0",  # starlette>=1.3 testclient prefers httpx2 over httpx
]

evaluation = [
    "magi-memo[api]",
    "ragas>=0.3.7",
    "datasets>=4.3.0",
]

observability = [
    # LLM observability and tracing dependencies
    "langfuse>=3.8.1",
]

[project.scripts]
magi-core-server = "magi_core.api.lightrag_server:main"
magi-core-gunicorn = "magi_core.api.run_with_gunicorn:main"
magi-hash-password = "magi_core.tools.hash_password:main"
magi-download-cache = "magi_core.tools.download_cache:main"
magi-clean-llmqc = "magi_core.tools.clean_llm_query_cache:main"
magi-rebuild-vdb = "magi_core.tools.rebuild_vdb:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["magi_core*", "magi_runtime*", "interface*"]
exclude = ["data*", "tests*", "scripts*", "examples*", "dickens*", "reproduce*", "output_complete*", "rag_storage*", "inputs*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "magi_core._version.__version__"}

[tool.setuptools.package-data]
magi_core = ["api/webui/**/*", "api/static/**/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
target-version = "py310"
